defaults:
  - env: a1_track
  - env@eval_env: a1_track_eval
  - _self_
  - override hydra/job_logging: custom

kp: null  # TT 형상 PD 비례 이득 덮어쓰기 (null = 원본 30)
choice: "00000010"  # TT design space choice 8 자리 (끝 2 자리 = 앞·뒤 무릎 반전). CLI 에서는 choice="'00000010'" 처럼 따옴표

wandb:
  tags: null

observe_domain_randomized_attrs: false  # 형상 DR 없음 (A1 1 개)


seed: 0
render_on_checkpoint: false
full_reset: true

extra_obs_attrs:
  - body_mass
  - body_pos
  - body_quat
  - body_inertia
  - body_mass
  - geom_size

train:
  _convert_: all
  _target_: t2.mjx_env.train.train
  num_timesteps: 400000000
  num_evals: 10
  num_eval_envs: 100
  reward_scaling: 1.0
  clipping_epsilon: 0.2
  episode_length: ${env.max_episode_length}
  normalize_observations: true
  action_repeat: 1
  unroll_length: 24
  num_minibatches: 4
  num_updates_per_batch: 8
  discounting: 0.99
  learning_rate: 1e-3
  entropy_cost: 1e-2
  gae_lambda: 0.95
  num_envs: 4096
  batch_size: 1024
  max_grad_norm: 1.0
  deterministic_eval: true
  log_training_metrics: false
  training_metrics_steps: null
  seed: ${seed}
  network_factory:
    _partial_: true
    _target_: brax.training.agents.ppo.networks.make_ppo_networks
    state_dependent_std: false
    init_noise_std: 1.0
    noise_std_type: scalar
    distribution_type: normal
    activation:
      # _target_: flax.linen.swish
      _target_: flax.linen.elu
      _partial_: true
    policy_hidden_layer_sizes:
      - 256
      - 128
      - 64
    value_hidden_layer_sizes:
      - 256
      - 128
      - 64
