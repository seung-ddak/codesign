kp: null
restore_ckpt: null
tau_scale: null
torque_limit: 33.5
choice: '00000011'
multi_design: true
train_designs:
- e000
- e001
- e002
- e004
- e005
- e006
- e007
- e008
- e009
- e010
- e011
- e012
- e013
- e014
- e015
- e016
wandb:
  tags: null
observe_domain_randomized_attrs: false
seed: 0
render_on_checkpoint: false
render_final: false
full_reset: true
extra_obs_attrs:
- body_mass
- body_pos
- body_quat
- body_inertia
- body_mass
- geom_size
train:
  _convert_: all
  _target_: t2.mjx_env.train.train
  num_timesteps: 14000000
  num_evals: 10
  num_eval_envs: 4
  reward_scaling: 1.0
  clipping_epsilon: 0.2
  episode_length: ${env.max_episode_length}
  normalize_observations: true
  action_repeat: 1
  unroll_length: 24
  num_minibatches: 4
  num_updates_per_batch: 8
  discounting: 0.99
  learning_rate: 0.001
  entropy_cost: 0.01
  gae_lambda: 0.95
  num_envs: 32
  batch_size: 32
  max_grad_norm: 1.0
  deterministic_eval: true
  log_training_metrics: false
  training_metrics_steps: null
  seed: ${seed}
  network_factory:
    _partial_: true
    _target_: brax.training.agents.ppo.networks.make_ppo_networks
    state_dependent_std: false
    init_noise_std: 1.0
    noise_std_type: scalar
    distribution_type: normal
    activation:
      _target_: flax.linen.elu
      _partial_: true
    policy_hidden_layer_sizes:
    - 256
    - 128
    - 64
    value_hidden_layer_sizes:
    - 256
    - 128
    - 64
